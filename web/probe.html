<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read probe | Milestone Oracle</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap" style="max-width:760px">
  <header class="top"><a class="brand" href="./"><img src="logo.png" alt="">Milestone Oracle</a><nav class="nav"><a href="app.html">Open the app</a></nav></header>
  <main><section style="padding-top:12px">
    <h2>Read probe</h2>
    <p>Diagnostic. Deploys a tiny contract that reads a milestone's state in three ways, to see which one the live network accepts. Use a Studio test account.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0"><button class="btn alt" id="connect" type="button">Connect wallet</button><span class="small" id="who">Not connected.</span></div>
    <button class="btn" id="deploy" type="button" disabled>1. Deploy the probe</button>
    <div class="notice" id="msg" style="margin-top:16px;white-space:pre-wrap;word-break:break-word" aria-live="polite">Nothing sent yet.</div>
    <div class="btns"><button class="btn alt" id="views" type="button" disabled>2. Run the instant read tests</button>
      <button class="btn alt" id="wfinal" type="button" disabled>3a. Write test: final</button>
      <button class="btn alt" id="wdefault" type="button" disabled>3b. Write test: default</button>
      <button class="btn alt" id="wnonfinal" type="button" disabled>3c. Write test: nonfinal</button></div>
    <pre id="out" style="white-space:pre-wrap;word-break:break-all">The report appears here.</pre>
    <div class="btns"><button class="btn alt" id="copy" type="button">Copy this report</button></div>
  </section></main>
</div>
<script src="probe.js"></script>
</body>
</html>
